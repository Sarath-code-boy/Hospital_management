<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePlusHospital</title>
    <link rel="icon" type="image/png" href="medical-symbol.png">
</head>
<style>
    body
    {
        margin: 0;
        
    }
    nav
    {
        background-color: rgb(0, 149, 255);
        padding: 20px;
    }
    nav li
    {
        list-style: none;
        text-align: center;
        color: white;
        padding: 10px;
        font-size: 25px;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }
    nav a
    {
        padding: 10px;
       align-self: center;
       text-decoration: none;
       color: white;
       box-shadow: 1px 1px 10px;
       border-radius: 50px;
       transition: 1s;
    }
    nav a:hover
    {
       transform: translateY(-5px);
    }
    .back
    {
       font-size: 20px; 
       margin-left: 50px;
    }
    form
    {
        text-align: center;
    }
    .name>img
    {
        width: 15px;
    }
    .name
    {
        margin-top: 10px;
        padding: 10px;
    }
    .phone>img
    {
        width: 15px;
    }
    .dept>img
    {
        width: 15px;
    }
    .dept
    {
        margin-top: 15px;
        margin-left: -5px;
        margin-bottom: 10px;
        
    }
    select
    {
        padding: 10px;
        width: 500px;
    }
    input
    {
        width: 500px;
        padding: 10px;
    }
    .doctor>img
    {
        width: 15px;
    }
    .doctor
    {
        margin-bottom: 10px;
    }
    .Appoinment>img
    {
        width: 15px;
        
    }
    .message>img
    {
       width: 15px;
    }
    .message
    {
        
        margin-top: 10px;
    }
    button
    {
        padding: 10px;
        border: none;
        background-color: rgb(0, 170, 255);
        color: white;
        border-radius: 10px;
        transition: 1s;
    }
    button:hover
    {
        box-shadow: 1px 1px 10px gray;
        background-color: rgb(232, 8, 8);
        transform: translateY(-4px);
        
    }
    .heart>img
    {
        width: 25px;
        margin-left: 730px;
        margin-top: -45px;
        animation: ZoomIn 0.5s linear infinite;
    }
    @keyframes ZoomIn
    {
        0%
        {
            transform: scale(1);
        }
        50%
        {
            transform: scale(1.5);
        }
        100%
        {
            transform: scale(1);
        }
    }
    @media screen and (max-width:600px)
    {
        input 
        {
            width: 300px;
        }
        select 
        {
            width: 300px;
        }
        button 
        {
            margin-left: 10px;
        }
        .heart>img 
        {
            margin-left: 340px;
        }
    }

</style>
<body>
    <nav>
        <a href="index.html">---Back</a>
        
        <li>Appoinment</li>
    </nav>
    <form>
        <div class="name">
            <img src="contact.png" alt="">
            <input  type="text" placeholder="Your Name" required pattern="[A-Za-z]{5,}">
        </div>
        <div class="phone">
            <img src="telephone.png" alt="">
            <input type="number" placeholder="Phone Number" required pattern="[0-9]{10,}">
        </div>
        <div class="dept">
            <img src="location.png" alt="">
            <select name="" id="" required>
            <option value="">Select Department</option>
            <option value="">Cardiology</option>
            <option value="">Neurology</option>
            <option value="">Orthopedics</option>
            <option value="">Pediatrics</option>
            </select>
        </div>
        <div class="doctor">
            <img src="stethoscope.png" alt="">
            <select name="" id="" required>
                <option value="">Select Doctor</option>
            <option value="">Dr.Arjun Sharma</option>
            <option value="">Dr.Neha Verma</option>
            <option value="">Dr.Rohan Mehta</option>
            <option value="">Dr.Priya Nehir</option>
            </select>
        </div>
        <div class="Appoinment">
            <img src="calendar.png" alt="">
            <input type="datetime-local" placeholder="Appoinment Date" required>
        </div>
        <div class="message">
            <img src="chatting.png" alt="">
            <input type="text" placeholder="Your Message" pattern="[A-Za-z]{10,}">
            <br><br>
            <button type="submit"> Book Appoinment Now</button>
        </div>
    </form>
    <div class="heart">
    <img src="heart-rate.png" alt="">
    </div>
    <script>
        
    </script>
</body>
</html>
